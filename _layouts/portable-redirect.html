<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting&hellip;</title>
    <link rel="canonical" href="{{ page.redirect_target | prepend: site.url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_target | relative_url }}">
    <meta name="robots" content="noindex">
    <script>window.location.replace({{ page.redirect_target | relative_url | jsonify }});</script>
  </head>
  <body>
    <p><a href="{{ page.redirect_target | relative_url }}">Continue to the requested page</a></p>
  </body>
</html>
